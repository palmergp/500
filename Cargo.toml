[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/lab", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = 1

[profile.release.package.fh-wasm]
debug = 0

# Search code is far too slow unoptimized; keep test builds of the engine and AI fast.
[profile.dev.package.fh-core]
opt-level = 2

[profile.dev.package.fh-ai]
opt-level = 2
