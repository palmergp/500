[package]
name = "fh-host"
description = "Hosts a 500 table on your local network: friends join from a browser over wifi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fh-core = { path = "../core" }
fh-ai = { path = "../ai" }
fh-wasm = { path = "../wasm" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
futures-util = "0.3.34"
include_dir = { version = "0.7.4", optional = true }
mime_guess = { version = "2.0.5", optional = true }

[features]
# Build the web app (web/dist) into the program, so it runs anywhere as a single file.
embed = ["dep:include_dir", "dep:mime_guess"]

[build-dependencies]
winresource = "0.1.34"
