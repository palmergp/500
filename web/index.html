    <!-- Added to an iPhone's home screen: full screen below a solid black status bar, and a short
         name under the icon. Not "black-translucent": with the page drawn under the status bar,
         iOS 26 blurs the top of it (its scroll-edge effect), the top bar included. The layout still
         pads by the safe-area insets for the home bar and a phone on its side. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="500" />
